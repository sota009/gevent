<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaker | The Web Needs an Agent Entrance</title>
  <style>
    :root{color-scheme:dark;--bg:#101412;--panel:#18201c;--panel-2:#202923;--text:#f1f5f0;--muted:#aeb9b1;--line:#425045;--accent:#9bd67a;--accent-2:#7dc4d8;--warn:#f2c66d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
    main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:100vh}
    .stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:28px;border-right:1px solid var(--line)}
    .topbar,.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
    .eyebrow{color:var(--accent);font-size:13px;font-weight:800;text-transform:uppercase}
    .timer{color:var(--muted);font-variant-numeric:tabular-nums}
    .slide{align-self:center;max-width:1040px;width:100%;padding:6vh 0}
    h1{margin:0 0 22px;max-width:980px;font-size:clamp(48px,7vw,92px);line-height:.98;letter-spacing:0}
    .headline{max-width:900px;margin:0 0 34px;color:var(--accent-2);font-size:clamp(24px,3.2vw,42px);line-height:1.14}
    ul{display:grid;gap:14px;max-width:860px;margin:0;padding-left:1.25em;color:var(--text);font-size:clamp(21px,2.2vw,32px);line-height:1.28}
    .columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:900px}
    .column{min-height:220px;padding:22px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
    .column h2{margin:0 0 16px;color:var(--warn);font-size:26px}
    .column ul{font-size:22px}
    .controls button{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:22px;cursor:pointer}
    .controls button:hover{border-color:var(--accent)}
    .side{display:grid;grid-template-rows:auto auto 1fr auto;gap:16px;padding:22px;background:var(--panel)}
    .side h2{margin:0 0 8px;font-size:15px;color:var(--accent);text-transform:uppercase}
    .side p{margin:0;color:var(--muted);line-height:1.5}
    .notes,.next,.takeaway,.join{padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
    .notes p{color:var(--text);font-size:17px}
    .join a{color:var(--accent-2);overflow-wrap:anywhere}
    .kbd{color:var(--muted);font-size:13px;line-height:1.5}
    @media (max-width:900px){main{grid-template-columns:1fr}.stage{min-height:72vh;border-right:0;border-bottom:1px solid var(--line)}.columns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <section class="stage">
      <div class="topbar">
        <div>
          <div class="eyebrow" id="sectionLabel"></div>
          <div id="counter"></div>
        </div>
        <div class="timer"><span id="elapsed">00:00</span> elapsed / <span id="remaining">20:00</span> left</div>
      </div>
      <article class="slide" id="slide"></article>
      <div class="controls">
        <div>
          <button type="button" id="prev" aria-label="Previous slide">&#8592;</button>
          <button type="button" id="next" aria-label="Next slide">&#8594;</button>
          <button type="button" id="reset" aria-label="Reset deck">&#8634;</button>
        </div>
        <div class="kbd">Keys: Left previous / Right next / R reset</div>
      </div>
    </section>
    <aside class="side">
      <div class="join">
        <h2>Participant Link</h2>
        <p><a id="participantLink" href="attendee.html">attendee.html</a></p>
      </div>
      <div class="next">
        <h2>Next</h2>
        <p id="nextTitle"></p>
      </div>
      <div class="notes">
        <h2>Speaker Notes</h2>
        <p id="notes"></p>
      </div>
      <div class="takeaway">
        <h2>Participant Takeaway</h2>
        <p id="takeaway"></p>
      </div>
    </aside>
  </main>

  <script>
    let deck;
    let index=0;
    const startedAt=Date.now();
    const slideEl=document.querySelector('#slide');
    const sectionLabel=document.querySelector('#sectionLabel');
    const counter=document.querySelector('#counter');
    const nextTitle=document.querySelector('#nextTitle');
    const notes=document.querySelector('#notes');
    const takeaway=document.querySelector('#takeaway');
    const elapsed=document.querySelector('#elapsed');
    const remaining=document.querySelector('#remaining');

    fetch('deck.json').then(response=>response.json()).then(async data=>{
      deck=data;
      document.querySelector('#participantLink').href=new URL('attendee.html',location.href).href;
      document.querySelector('#participantLink').textContent=new URL('attendee.html',location.href).href;
      const state=await fetch('/api/session',{cache:'no-store'}).then(response=>response.json());
      index=Math.max(0,deck.slides.findIndex(slide=>slide.id===state.currentSlideId));
      render();
      setInterval(renderTime,1000);
    });

    function render(){
      const slide=deck.slides[index];
      const section=deck.sections.find(item=>item.slides.includes(slide.id));
      document.title=`Speaker | ${deck.title}`;
      sectionLabel.textContent=`${section.purpose.replaceAll('-',' ')} | ${slide.type}`;
      counter.textContent=`Slide ${index+1} of ${deck.slides.length}`;
      slideEl.innerHTML=renderSlideContent(slide);
      nextTitle.textContent=deck.slides[index+1]?deck.slides[index+1].title:'End of deck';
      notes.textContent=slide.notes;
      takeaway.textContent=slide.attendeeTakeaway;
      renderTime();
    }

    function renderSlideContent(slide){
      const content=slide.content;
      const list=content.bullets?`<ul>${content.bullets.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul>`:'';
      const columns=content.columns?`<div class="columns">${content.columns.map(column=>`
        <section class="column">
          <h2>${escapeHtml(column.label)}</h2>
          <ul>${column.items.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul>
        </section>
      `).join('')}</div>`:'';
      const nextAction=content.nextAction?`<p class="headline">${escapeHtml(content.nextAction)}</p>`:'';
      return `<h1>${escapeHtml(slide.title)}</h1><p class="headline">${escapeHtml(content.headline)}</p>${list}${columns}${nextAction}`;
    }

    function renderTime(){
      const elapsedSeconds=Math.floor((Date.now()-startedAt)/1000);
      const totalSeconds=deck.durationMinutes*60;
      elapsed.textContent=formatTime(elapsedSeconds);
      remaining.textContent=formatTime(Math.max(totalSeconds-elapsedSeconds,0));
    }

    function formatTime(seconds){
      const minutes=Math.floor(seconds/60);
      const rest=seconds%60;
      return `${String(minutes).padStart(2,'0')}:${String(rest).padStart(2,'0')}`;
    }

    function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}

    async function setSlide(slideId){
      const state=await fetch('/api/session/slide',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({slideId})}).then(response=>response.json());
      index=Math.max(0,deck.slides.findIndex(slide=>slide.id===state.currentSlideId));
      render();
    }

    function go(delta){
      const nextIndex=Math.min(Math.max(index+delta,0),deck.slides.length-1);
      setSlide(deck.slides[nextIndex].id);
    }

    document.querySelector('#prev').addEventListener('click',()=>go(-1));
    document.querySelector('#next').addEventListener('click',()=>go(1));
    document.querySelector('#reset').addEventListener('click',()=>setSlide(deck.slides[0].id));
    document.addEventListener('keydown',event=>{
      if(event.key==='ArrowLeft')go(-1);
      if(event.key==='ArrowRight')go(1);
      if(event.key.toLowerCase()==='r')setSlide(deck.slides[0].id);
    });
  </script>
</body>
</html>
